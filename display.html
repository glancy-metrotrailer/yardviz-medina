<!DOCTYPE html>
<html lang="en">
<head>

    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --metro-navy: #0c2340;
            --metro-blue: #0066cc;
            --metro-orange: #F7941D;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-family: 'Inter', -apple-system, sans-serif; }
        #map { position: absolute; inset: 0; }

        /* Header banner */
        .display-header {
            position: absolute;
            top: 0; left: 0; right: 0;
            z-index: 10;
            background: linear-gradient(180deg, rgba(12,35,64,0.92) 0%, rgba(12,35,64,0.0) 100%);
            padding: 1rem 1.5rem 2.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            pointer-events: none;
        }
        .display-title {
            display: flex; align-items: center; gap: 0.75rem;
            color: #fff;
        }
        .display-logo {
            width: 40px; height: 40px; border-radius: 9px;
            background: var(--metro-navy);
            border: 1px solid rgba(255,255,255,0.25);
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 1.1rem;
        }
        .display-logo .y { color: #fff; }
        .display-logo .v { color: var(--metro-blue); }
        .display-title h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.01em; }
        .display-yard {
            color: #fff; font-size: 1.4rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: 0.04em;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }

        /* Waiting / empty state */
        .waiting {
            position: absolute; inset: 0; z-index: 5;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: var(--metro-navy);
            color: #fff; text-align: center; gap: 1rem;
            transition: opacity 0.4s;
        }
        .waiting.hidden { opacity: 0; pointer-events: none; }
        .waiting-logo {
            width: 96px; height: 96px; border-radius: 20px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.15);
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 2.5rem; margin-bottom: 0.5rem;
        }
        .waiting-logo .y { color: #fff; }
        .waiting-logo .v { color: var(--metro-blue); }
        .waiting h2 { font-size: 1.75rem; font-weight: 700; }
        .waiting p { font-size: 1.05rem; opacity: 0.7; }

        /* Trailer count pill */
        .count-pill {
            position: absolute; bottom: 1.25rem; left: 50%;
            transform: translateX(-50%); z-index: 10;
            background: rgba(12,35,64,0.9);
            color: #fff; padding: 0.6rem 1.4rem;
            border-radius: 999px; font-size: 1.05rem; font-weight: 600;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            display: none;
        }

        /* Locate-style markers (matched to main app) */
        .locate-marker-container {
            display: flex; flex-direction: column; align-items: center;
        }
        .locate-marker {
            background: var(--metro-navy); color: white;
            font-size: 16px; font-weight: 700;
            padding: 8px 14px; border-radius: 8px; white-space: nowrap;
            box-shadow: 0 3px 12px rgba(0,0,0,0.5);
            border: 3px solid white;
            display: inline-flex; align-items: center; gap: 8px;
        }
        .locate-marker-pointer {
            width: 0; height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 12px solid var(--metro-navy);
        }
        /* subtle pulse to draw the eye */
        .locate-marker { animation: markerpulse 1.8s ease-in-out infinite; }
        @keyframes markerpulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        .stale-note {
            position: absolute; top: 4.5rem; left: 50%; transform: translateX(-50%);
            z-index: 10; background: rgba(220,38,38,0.92); color: #fff;
            padding: 0.4rem 1rem; border-radius: 6px; font-size: 0.9rem; font-weight: 600;
            display: none;
        }

        .token-setup {
            position: absolute; inset: 0; z-index: 30;
            background: rgba(12,35,64,0.97);
            display: flex; align-items: center; justify-content: center;
        }
        .token-box {
            background: #fff; border-radius: 14px; padding: 2rem;
            max-width: 420px; width: 90%; text-align: center;
        }
        .token-box h2 { color: var(--metro-navy); margin-bottom: 0.5rem; }
        .token-box p { color: #475569; font-size: 0.95rem; margin-bottom: 1rem; }
        .token-box input {
            width: 100%; padding: 0.7rem; border: 1px solid #cbd5e1;
            border-radius: 8px; font-size: 0.95rem; margin-bottom: 0.75rem;
        }
        .token-box button {
            width: 100%; padding: 0.7rem; background: var(--metro-blue);
            color: #fff; border: none; border-radius: 8px;
            font-size: 1rem; font-weight: 600; cursor: pointer;
        }
        .token-note { font-size: 0.8rem !important; color: #94a3b8 !important; margin: 0.75rem 0 0 !important; }

        /* "You are here" marker */
        .yah-marker { display: flex; flex-direction: column; align-items: center; }
        .yah-label {
            background: #ef4444; color: #fff;
            font-size: 13px; font-weight: 800; letter-spacing: 0.02em;
            padding: 5px 11px; border-radius: 6px; white-space: nowrap;
            box-shadow: 0 3px 10px rgba(0,0,0,0.5);
            border: 2px solid #fff; text-transform: uppercase;
        }
        .yah-dot {
            width: 16px; height: 16px; border-radius: 50%;
            background: #ef4444; border: 3px solid #fff; margin-top: 3px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <div class="display-header">
        <div class="display-title">
            <div class="display-logo"><span class="y">Y</span><span class="v">V</span></div>
            <h1>Trailer Locator</h1>
        </div>
        <div class="display-yard" id="yardName"></div>
    </div>

    <div class="stale-note" id="staleNote">Showing last known location</div>
    <div class="count-pill" id="countPill"></div>

    <div class="waiting" id="waiting">
        <div class="waiting-logo"><span class="y">Y</span><span class="v">V</span></div>
        <h2>Ready</h2>
        <p>Waiting for a trailer to be sent to the display…</p>
    </div>

    <script>
    const DISPLAY = {
        // Config mirrored from the main app
        mapTilerKey: 'u9TdeBJu4j9tNG1lZiu5',
        satelliteStyle: 'https://api.maptiler.com/maps/hybrid/style.json',
        owner: 'glancy-metrotrailer',
        repo: 'yardviz-medina',
        statePath: 'data/display-state.json',
        // Fallback raw URL (used only if no token is set - can be up to ~5 min stale)
        rawUrl: 'https://raw.githubusercontent.com/glancy-metrotrailer/yardviz-medina/main/data/display-state.json',
        pollMs: 3000,
        yards: {
            // bearing: map rotation per yard - 0 = north up, 180 = south up.
            // Yards with a drone photo are framed to fit the whole photo on screen;
            // others use center/zoom.
            medina:  { name: 'Medina',  center: [-81.8976600, 41.1478500], zoom: 17, bearing: 180, youAreHere: [-81.89795624680701, 41.14860406577813],
                       // Drone photo - keep these corners in sync with the Medina overlay in index.html
                       overlay: {
                           image: 'data/medina_lot_pic_blended.webp',
                           corners: [
                               [-81.8998356, 41.1483882],  // top-left
                               [-81.8982832, 41.1495759],  // top-right
                               [-81.8954801, 41.1474984],  // bottom-right
                               [-81.8970325, 41.1463107]   // bottom-left
                           ]
                       } },
            seville: { name: 'Seville', center: [-81.8687802, 41.0315114], zoom: 16, bearing: 0 }
        },

        map: null,
        markers: [],
        yahMarker: null,       // "you are here" marker
        lastSignature: null,   // to detect changes without redundant re-renders
        activeYard: null,
        photoYard: null,       // yard whose drone photo is currently on the map
        framedYard: null,      // yard the camera is currently framed on
        token: null,

        init() {
            // Visiting with ?reset clears the stored token and re-shows setup
            // (handy on a TV/kiosk where you can't open the console)
            if (location.search.indexOf('reset') !== -1) {
                localStorage.removeItem('yardviz_display_token');
            }
            
            this.token = localStorage.getItem('yardviz_display_token')
                      || localStorage.getItem('yardviz_github_token');
            
            this.map = new maplibregl.Map({
                container: 'map',
                style: `${this.satelliteStyle}?key=${this.mapTilerKey}`,
                center: this.yards.medina.center,
                zoom: this.yards.medina.zoom,
                bearing: this.yards.medina.bearing || 0,
                attributionControl: false
            });
            this.map.on('load', () => {
                this.drawDronePhoto('medina');
                this.frameYard('medina', false);
                this.poll();
                setInterval(() => this.poll(), this.pollMs);
            });
            
            // Keep the whole lot in view if the screen size changes
            this.map.on('resize', () => {
                const y = this.framedYard;
                this.framedYard = null;
                if (y) this.frameYard(y, false);
            });
            
            if (!this.token) this.showTokenSetup();
        },
        
        // Fixed camera per yard: never zooms to individual trailers
        frameYard(yard, animate) {
            const cfg = this.yards[yard] || this.yards.medina;
            if (!this.map || this.framedYard === yard) return;
            this.framedYard = yard;
            const bearing = cfg.bearing || 0;
            const duration = animate ? 900 : 0;
            const corners = cfg.overlay && cfg.overlay.corners;
            if (corners) {
                // Fit the photo's actual (rotated) outline as tightly as the screen allows
                const pad = { top: 80, bottom: 20, left: 20, right: 20 };  // top clears the header bar
                const center = [
                    corners.reduce((a, c) => a + c[0], 0) / corners.length,
                    corners.reduce((a, c) => a + c[1], 0) / corners.length
                ];
                const cosLat = Math.cos(center[1] * Math.PI / 180);
                const t = bearing * Math.PI / 180;
                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                corners.forEach(c => {
                    const e = (c[0] - center[0]) * 111320 * cosLat;   // metres east
                    const n = (c[1] - center[1]) * 111320;            // metres north
                    // screen axes after rotating the map by the bearing
                    const x = e * Math.cos(t) - n * Math.sin(t);
                    const y = e * Math.sin(t) + n * Math.cos(t);
                    minX = Math.min(minX, x); maxX = Math.max(maxX, x);
                    minY = Math.min(minY, y); maxY = Math.max(maxY, y);
                });
                const box = this.map.getContainer();
                const availW = box.clientWidth - pad.left - pad.right;
                const availH = box.clientHeight - pad.top - pad.bottom;
                const mppZ0 = 40075016.686 * cosLat / 512;             // metres per pixel at zoom 0
                const zoom = Math.min(
                    Math.log2(mppZ0 * availW / (maxX - minX)),
                    Math.log2(mppZ0 * availH / (maxY - minY))
                );
                this.map.easeTo({ center, zoom, bearing, padding: pad, duration });
            } else {
                this.map.easeTo({ center: cfg.center, zoom: cfg.zoom, bearing, duration });
            }
        },

        async poll() {
            try {
                let state;
                if (this.token) {
                    // GitHub API - always fresh (no CDN cache), needs token for poll rate
                    const res = await fetch(
                        `https://api.github.com/repos/${this.owner}/${this.repo}/contents/${this.statePath}?ref=main`,
                        { headers: { 'Authorization': `token ${this.token}`, 'Accept': 'application/vnd.github.v3+json' }, cache: 'no-store' }
                    );
                    if (!res.ok) return;
                    const data = await res.json();
                    // GitHub API returns base64 with embedded newlines - strip them before decoding
                    const b64 = (data.content || '').replace(/\s/g, '');
                    state = JSON.parse(decodeURIComponent(escape(atob(b64))));
                } else {
                    // Fallback: raw CDN (may lag up to ~5 min)
                    const res = await fetch(`${this.rawUrl}?t=${Date.now()}`, { cache: 'no-store' });
                    if (!res.ok) return;
                    state = await res.json();
                }
                this.apply(state);
            } catch (e) {
                console.warn('poll failed', e);
            }
        },
        
        showTokenSetup() {
            const o = document.createElement('div');
            o.className = 'token-setup';
            o.innerHTML = `
                <div class="token-box">
                    <h2>One-time setup</h2>
                    <p>Paste a GitHub token so this display stays up to date in real time. It's stored only on this device.</p>
                    <input type="password" id="tokenInput" placeholder="GitHub token" />
                    <button id="tokenSave">Save & Start</button>
                    <p class="token-note">A fine-grained token with read-only Contents access to this repo is recommended.</p>
                </div>`;
            document.body.appendChild(o);
            document.getElementById('tokenSave').onclick = () => {
                const v = document.getElementById('tokenInput').value.trim();
                if (!v) return;
                localStorage.setItem('yardviz_display_token', v);
                this.token = v;
                o.remove();
                this.poll();
            };
        },

        apply(state) {
            const trailers = Array.isArray(state && state.trailers) ? state.trailers : [];
            const yard = state && state.yard;

            // Build a signature so we only re-render when the pushed set actually changes
            const sig = JSON.stringify({ yard, ids: trailers.map(t => t.id).sort() });
            if (sig === this.lastSignature) return;
            this.lastSignature = sig;

            // Clear old markers
            this.markers.forEach(m => m.remove());
            this.markers = [];

            if (trailers.length === 0) {
                this.showWaiting(true);
                document.getElementById('countPill').style.display = 'none';
                document.getElementById('yardName').textContent = '';
                return;
            }

            this.showWaiting(false);

            // Yard label + switch base view if the yard changed
            if (yard && this.yards[yard]) {
                document.getElementById('yardName').textContent = this.yards[yard].name;
                this.activeYard = yard;
            }
            
            // Drone photo + "You are here" marker for yards that define them
            this.drawDronePhoto(yard || 'medina');
            this.drawYouAreHere(yard);

            // Draw markers - keep the whole yard in view (don't zoom to the trailer)
            let placed = 0;
            trailers.forEach(t => {
                const lat = parseFloat(t.lat), lng = parseFloat(t.lng);
                if (isNaN(lat) || isNaN(lng)) return;
                const el = document.createElement('div');
                el.className = 'locate-marker-container';
                el.innerHTML = `<div class="locate-marker"><span class="locate-marker-text">${t.id}</span></div>
                                <div class="locate-marker-pointer"></div>`;
                const marker = new maplibregl.Marker({ element: el, anchor: 'bottom' })
                    .setLngLat([lng, lat]).addTo(this.map);
                this.markers.push(marker);
                placed++;
            });

            const pill = document.getElementById('countPill');
            if (placed > 1) {
                pill.textContent = `${placed} trailers`;
                pill.style.display = 'block';
            } else {
                pill.style.display = 'none';
            }

            // Camera stays on the whole lot; it only moves when the yard changes
            this.frameYard((yard && this.yards[yard]) ? yard : 'medina', true);
        },

        showWaiting(show) {
            document.getElementById('waiting').classList.toggle('hidden', !show);
        },
        
        drawDronePhoto(yard) {
            if (!this.map || yard === this.photoYard) return;
            if (this.map.getLayer('drone-photo')) this.map.removeLayer('drone-photo');
            if (this.map.getSource('drone-photo')) this.map.removeSource('drone-photo');
            this.photoYard = yard;
            
            const ov = this.yards[yard] && this.yards[yard].overlay;
            if (!ov || !ov.corners) return;
            
            // Under the map's labels so road names still show on top
            const firstLabel = (this.map.getStyle().layers || []).find(l => l.type === 'symbol');
            this.map.addSource('drone-photo', {
                type: 'image',
                url: `https://raw.githubusercontent.com/${this.owner}/${this.repo}/main/${ov.image}`,
                coordinates: ov.corners
            });
            this.map.addLayer({
                id: 'drone-photo',
                type: 'raster',
                source: 'drone-photo',
                paint: { 'raster-opacity': 1, 'raster-fade-duration': 0 }
            }, firstLabel ? firstLabel.id : undefined);
        },
        
        drawYouAreHere(yard) {
            const cfg = yard && this.yards[yard];
            const yah = cfg && cfg.youAreHere;
            // Remove any existing marker first (yard may have changed)
            if (this.yahMarker) { this.yahMarker.remove(); this.yahMarker = null; }
            if (!yah) return;
            const el = document.createElement('div');
            el.className = 'yah-marker';
            el.innerHTML = `<div class="yah-label">You Are Here</div><div class="yah-dot"></div>`;
            this.yahMarker = new maplibregl.Marker({ element: el, anchor: 'bottom' })
                .setLngLat(yah).addTo(this.map);
        }
    };

    DISPLAY.init();
    </script>
</body>
</html>
